<title>What happens when you click Buy</title>
<desc>What happens when you click Buy. You → Broker: buy 10 AAPL @ limit 190. Broker → Broker: margin + risk check. Broker → Exchange: new order. Exchange → Order book: match against asks. Order book → Exchange: seller hits 190.00. Exchange → Broker: filled 10 @ 190.00. Broker → You: order filled. Note on Order book: best ask 190.02 so it rests on the book.</desc>
