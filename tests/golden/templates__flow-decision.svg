<title>Should we cache it?</title>
<desc>Should we cache it?. A request comes in → Seen it before?. Seen it before? → Answer from the cache: yes. Seen it before? → Do the work, then keep it: no. Answer from the cache → Reply. Do the work, then keep it → Reply.</desc>
